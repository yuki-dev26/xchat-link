<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X DMリンク</title>
  <meta name="description" content="Xのユーザー名からDM作成リンクを生成します。" />
  <style>
    :root {
      --bg: #0a0a0b;
      --subtle: #1c1c20;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --subtle-fg: #71717a;
      --primary: #d4d8e0;
      --primary-fg: #0a0a0b;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 32rem; padding: 3rem 1.25rem; }
    .kicker { margin: 0; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
    h1 { margin: 0.5rem 0 0; font-size: 1.875rem; letter-spacing: -0.03em; }
    .lead { margin: 0.75rem 0 0; color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
    form, .result { margin-top: 2rem; padding: 1rem; background: var(--subtle); border-radius: 1.5rem; }
    .result { margin-top: 1.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--muted); }
    .row { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
    input {
      flex: 1;
      min-width: 12rem;
      height: 2.75rem;
      border: 0;
      border-radius: 0.75rem;
      padding: 0 0.875rem;
      background: #141416;
      color: var(--fg);
      font: inherit;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }
    input:focus { outline: 2px solid color-mix(in oklab, var(--fg) 35%, transparent); }
    button {
      height: 2.75rem;
      min-width: 7rem;
      border: 0;
      border-radius: 0.75rem;
      padding: 0 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: var(--primary-fg);
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.secondary {
      background: #141416;
      color: var(--fg);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }
    .error { margin: 0.75rem 0 0; color: var(--danger); font-size: 0.875rem; }
    .meta { margin: 0; font-size: 0.875rem; color: var(--muted); }
    .link { margin: 0.75rem 0 0; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.875rem; }
    .copy-wrap { margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">X Direct Message</p>
    <h1>DMリンク</h1>
    <p class="lead">ユーザー名を入れると、その人宛のメッセージ作成リンクが出ます。</p>
    <form id="form">
      <label for="username">ユーザー名</label>
      <div class="row">
        <input id="username" name="username" placeholder="@handle" autocomplete="off" autocapitalize="none" spellcheck="false" />
        <button id="submit" type="submit" disabled>生成</button>
      </div>
      <p id="error" class="error" hidden></p>
    </form>
    <section id="result" class="result" hidden>
      <p id="meta" class="meta"></p>
      <p id="link" class="link"></p>
      <div class="copy-wrap">
        <button id="copy" class="secondary" type="button">コピー</button>
      </div>
    </section>
  </main>
  <script>
    const HANDLE_RE = /^[A-Za-z0-9_]{1,15}$/;
    const form = document.getElementById("form");
    const input = document.getElementById("username");
    const submit = document.getElementById("submit");
    const errorEl = document.getElementById("error");
    const result = document.getElementById("result");
    const meta = document.getElementById("meta");
    const linkEl = document.getElementById("link");
    const copyBtn = document.getElementById("copy");
    let currentLink = "";

    function normalizeUsername(raw) {
      const trimmed = raw.trim();
      const urlMatch = trimmed.match(/(?:x|twitter)\.com\/(?:#!\/)?@?([A-Za-z0-9_]{1,15})(?:\/|$|\?|#)/i);
      if (urlMatch) return urlMatch[1];
      const handle = trimmed.replace(/^@/, "");
      if (!HANDLE_RE.test(handle)) throw new Error("ユーザー名の形式が正しくありません");
      return handle;
    }

    function setError(msg) {
      errorEl.hidden = !msg;
      errorEl.textContent = msg || "";
    }

    input.addEventListener("input", () => {
      submit.disabled = !input.value.trim();
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      setError("");
      result.hidden = true;
      currentLink = "";
      let username;
      try {
        username = normalizeUsername(input.value);
      } catch (err) {
        setError(err.message);
        return;
      }
      submit.disabled = true;
      submit.textContent = "…";
      try {
        const res = await fetch("https://api.fxtwitter.com/" + encodeURIComponent(username));
        if (res.status === 404) throw new Error("そのユーザーは見つかりませんでした");
        if (!res.ok) throw new Error("ユーザーの取得に失敗しました。しばらくして再試行してください");
        const data = await res.json();
        const id = data?.user?.id != null ? String(data.user.id) : "";
        if (!id) throw new Error("ユーザーIDを取得できませんでした");
        const screen = data.user.screen_name || username;
        const name = data.user.name || "";
        currentLink = "https://x.com/messages/compose?recipient_id=" + id;
        meta.textContent = "@" + screen + (name ? " · " + name : "");
        linkEl.textContent = currentLink;
        copyBtn.textContent = "コピー";
        result.hidden = false;
      } catch (err) {
        setError(err.message || "取得に失敗しました");
      } finally {
        submit.textContent = "生成";
        submit.disabled = !input.value.trim();
      }
    });

    copyBtn.addEventListener("click", async () => {
      if (!currentLink) return;
      await navigator.clipboard.writeText(currentLink);
      copyBtn.textContent = "コピーしました";
      setTimeout(() => { copyBtn.textContent = "コピー"; }, 1600);
    });
  </script>
</body>
</html>
