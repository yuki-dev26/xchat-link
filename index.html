<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My X Chat Link Generator</title>
    <meta
      name="description"
      content="My X Chat Link Generator — Xのユーザー名からチャット（DM）作成リンクを生成します。"
    />
    <meta name="application-name" content="My X Chat Link Generator" />
    <meta property="og:title" content="My X Chat Link Generator" />
    <meta
      property="og:description"
      content="Xのユーザー名からチャット（DM）作成リンクを生成します。"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <h1>My X Chat Link Generator</h1>
      <p class="lead">
        ユーザー名を入れると、その人宛のチャット(DM)リンクが得られます。
      </p>
      <form id="form">
        <label for="username">ユーザー名</label>
        <div class="row">
          <input
            id="username"
            name="username"
            placeholder="@handle"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          />
          <button id="submit" type="submit" disabled>生成</button>
        </div>
        <p id="error" class="error" hidden role="alert"></p>
      </form>
      <section id="result" class="result" hidden aria-live="polite">
        <p id="meta" class="meta"></p>
        <p id="link" class="link"></p>
        <div class="copy-wrap">
          <button id="copy" class="secondary" type="button">コピー</button>
        </div>
      </section>
    </main>
    <script src="js/app.js" defer></script>
  </body>
</html>
