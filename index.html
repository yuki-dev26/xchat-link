<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My X Chat Link Generator</title>
    <meta
      name="description"
      content="My X Chat Link Generator — Xのユーザー名からチャット(DM)リンクを生成します。"
    />
    <meta name="application-name" content="My X Chat Link Generator" />
    <link rel="canonical" href="https://yuki-dev26.github.io/xchat-link/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://yuki-dev26.github.io/xchat-link/"
    />
    <meta property="og:site_name" content="My X Chat Link Generator" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="My X Chat Link Generator" />
    <meta
      property="og:description"
      content="Xのユーザー名からチャット(DM)リンクを生成します。"
    />
    <meta
      property="og:image"
      content="https://yuki-dev26.github.io/xchat-link/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="My X Chat Link Generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My X Chat Link Generator" />
    <meta
      name="twitter:description"
      content="Xのユーザー名からチャット(DM)リンクを生成します。"
    />
    <meta
      name="twitter:image"
      content="https://yuki-dev26.github.io/xchat-link/og.png"
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <main>
        <h1>My X Chat Link Generator</h1>
        <p class="lead">
          ユーザー名を入れると、その人宛のチャット(DM)リンクが得られます。
        </p>
        <form id="form">
          <label for="username">ユーザー名</label>
          <div class="row">
            <input
              id="username"
              name="username"
              placeholder="@handle"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
            />
            <button id="submit" type="submit" disabled>生成</button>
          </div>
          <p id="error" class="error" hidden role="alert"></p>
        </form>
        <section id="result" class="result" hidden aria-live="polite">
          <p id="meta" class="meta"></p>
          <div class="link-row">
            <p id="link" class="link"></p>
            <button
              id="copy"
              class="copy-icon secondary"
              type="button"
              aria-label="リンクをコピー"
              title="コピー"
            >
              <svg
                class="icon-copy"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
              <svg
                class="icon-check"
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </button>
          </div>
        </section>
      </main>
      <footer class="credit">
        <a
          class="credit-btn"
          href="https://yukip02.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="credit-btn__icon"
            src="P-icon.png"
            width="32"
            height="32"
            alt=""
          />
          yuki-P
        </a>
      </footer>
    </div>
    <script src="js/app.js" defer></script>
  </body>
</html>
